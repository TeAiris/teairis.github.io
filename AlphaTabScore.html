<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlphaTex Macro Cards — Live Preview (Minimal)</title>

    <!-- AlphaTab build -->
    <script src="https://teairis.github.io/AlphaTabLib/dist/alphaTab.js"></script>

    <style>
        :root {
            --border: #e7e7e7;
            --shadow: 0 1px 10px rgba(0,0,0,.05);
            --radius: 14px;
            --muted: #6b6b6b;
        }

        body {
            margin: 16px;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: #111;
            background: #fff;
        }

        .top { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; margin-bottom:14px; }
        .panel {
            flex:1;
            min-width: 320px;
            border:1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            background:#fff;
            padding:12px;
        }

        .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        input, textarea {
            width:100%;
            padding:10px;
            border:1px solid var(--border);
            border-radius: 10px;
            font-size:14px;
            outline:none;
        }
        textarea {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            height: 92px;
            resize: vertical;
        }

        button {
            padding:10px 12px;
            border:1px solid var(--border);
            background:#f7f7f7;
            border-radius: 10px;
            font-size:14px;
            cursor:pointer;
        }
        button:hover { background:#f1f1f1; }

        .hint {
            font-size:12px;
            color: var(--muted);
            margin-top:6px;
            line-height:1.35;
        }

        .previewBox {
            border:1px solid #f0f0f0;
            border-radius:12px;
            padding:10px;
            background:#fff;
            display:inline-block;
            overflow:visible;
        }
        .previewBox svg { display:block; height:auto; }

        .cards {
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            align-items:flex-start;
        }

        .card {
            border:1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            background:#fff;
            padding:12px;
            display:inline-block;
            overflow:visible;
        }

        .cardHdr {
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            margin-bottom:10px;
        }
        .cardTitle {
            font-weight:650;
            font-size:14px;
            margin:0;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            max-width:150px;
        }
        .mini {
            padding:6px 10px;
            font-size:12px;
            border-radius:9px;
        }
        .cardNotation {
            display:inline-block;
            overflow:visible;
        }
        .cardNotation svg { display:block; height:auto; }
    </style>
</head>

<body>

<div class="top">
    <div class="panel">
        <div class="row">
            <div style="flex:1; min-width:220px;">
                <input id="titleInput" placeholder="Card title (UI only)" />
            </div>
            <button id="addBtn">Add Card</button>
            <button id="clearBtn">Clear</button>
        </div>
        <div style="margin-top:10px;">
            <textarea id="texInput" spellcheck="false" placeholder="AlphaTex letter syntax...">:4 C4 D4 E4 F4 | G4 A4 B4 C5</textarea>
            <div class="hint">
                Preview updates live. Cards will size exactly to measure width.
            </div>
        </div>
    </div>

    <div class="panel" style="max-width:560px;">
        <div style="font-weight:650; margin-bottom:8px;">Preview</div>
        <div id="previewWrap" class="previewBox" aria-label="Preview notation"></div>
        <div class="hint" style="margin-top:6px;">
            Staff lines visible. Clef, dynamics, title, and tempo hidden.
        </div>
    </div>
</div>

<div id="cards" class="cards"></div>

<script>
    // render as percussion unless full doc passed
    function looksLikeFullAlphaTex(tex) {
        return /\\track\b|\\instrument\b|\\title\b|\\tempo\b/i.test(tex);
    }
    function wrapPercussion(body) {
        return `\\track "Perc"\n\\instrument drums\n${body.trim()}`;
    }
    function normalize(tex) {
        const t = (tex||"").trim();
        if (!t) return "";
        return looksLikeFullAlphaTex(t) ? t : wrapPercussion(t);
    }

    function buildSettings() {
        return {
            core: { tex:true, engine:"svg" },
            player: { enablePlayer:false, enableCursor:false },
            display: { barsPerRow:4 }
        };
    }

    function hideExcess(score) {
        try {
            const A = alphaTab.model;
            const T = A.Color.fromJson("rgba(0,0,0,0)");

            // Score header/directions
            score.style = score.style || new A.ScoreStyle();
            const SS = A.ScoreSubElement;
            [SS.Title,SS.SubTitle,SS.Artist,SS.Directions,SS.Marker].forEach(k=>{ if(k!==undefined) score.style.colors.set(k,T); });

            // Track and bar internals
            for(const track of score.tracks||[]) {
                track.style = track.style || new A.TrackStyle();
                const TS = A.TrackSubElement;
                [TS.TrackName,TS.SystemSeparator,TS.StringTuning].forEach(k=>{ if(k!==undefined) track.style.colors.set(k,T); });

                for(const staff of track.staves||[]) {
                    for(const bar of staff.bars||[]) {
                        bar.style = bar.style || new A.BarStyle();
                        const BS = A.BarSubElement;
                        [BS.StandardNotationClef,BS.StandardNotationBarNumber,BS.StandardNotationKeySignature,BS.StandardNotationTimeSignature].forEach(k=>{ if(k!==undefined) bar.style.colors.set(k,T); });
                    }
                }
            }
        } catch(e) {
            console.warn("hideExcess:",e);
        }
    }

    const previewWrap = document.getElementById("previewWrap");
    const texInput = document.getElementById("texInput");
    const titleInput = document.getElementById("titleInput");
    const addBtn = document.getElementById("addBtn");
    const clearBtn = document.getElementById("clearBtn");
    const cardsEl = document.getElementById("cards");

    const previewApi = new alphaTab.AlphaTabApi(previewWrap, buildSettings());
    previewApi.scoreLoaded.on(score=>{ hideExcess(score); previewApi.render(); });

    function renderPreview() {
        const tex = normalize(texInput.value);
        if (!tex) { previewWrap.innerHTML=""; return; }
        previewApi.tex(tex);
    }
    texInput.addEventListener("input", ()=> setTimeout(renderPreview,120));
    renderPreview();

    function createCard(title, rawTex) {
        const id = crypto.randomUUID ? crypto.randomUUID() : ""+Date.now();

        const card = document.createElement("div");
        card.className="card";

        card.innerHTML=`
        <div class="cardHdr">
          <h3 class="cardTitle" title="${title}">${title}</h3>
          <button class="mini" data-remove>Remove</button>
        </div>
        <div class="cardNotation" id="notation-${id}"></div>
      `;
        cardsEl.prepend(card);

        const host=card.querySelector(`#notation-${id}`);
        const removeBtn=card.querySelector("[data-remove]");

        const api=new alphaTab.AlphaTabApi(host,buildSettings());
        api.scoreLoaded.on(score=>{ hideExcess(score); api.render(); });
        api.renderFinished.on(ev=>{
            // now we can size card to actual SVG width
            const svg=host.querySelector("svg");
            if(svg){
                const w=svg.getBoundingClientRect().width||0;
                if(w>0){
                    // account for paddings/borders
                    const cw= Math.ceil(w + 2*12 + 2*1); // card padding (12) + border (1)
                    card.style.width=`${cw}px`;
                }
            }
        });

        api.tex(normalize(rawTex));
        removeBtn.onclick=()=>{ api.destroy && api.destroy(); card.remove(); };
    }

    addBtn.onclick=()=>{
        const t=(titleInput.value||"").trim()||"Untitled";
        const x=(texInput.value||"").trim();
        if(x) createCard(t,x);
    };
    clearBtn.onclick=()=>{ cardsEl.innerHTML=""; };

</script>

</body>
</html>
